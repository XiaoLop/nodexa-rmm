name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'deploy/compose/compose.site.prod.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 复用已有镜像标签（留空则构建当前提交）
        type: string
        default: ''

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meshcentral/site typecheck
      - run: pnpm --filter @meshcentral/site lint

  images:
    needs: checks
    if: always() && (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      namespace: ${{ steps.vars.outputs.namespace }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve namespace and tag
        id: vars
        run: |
          echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate public build variables
        if: inputs.image_tag == ''
        run: |
          test -n "${{ vars.SITE_PUBLIC_URL }}" || { echo "::error::Repository variable SITE_PUBLIC_URL is required"; exit 1; }

      - uses: docker/setup-buildx-action@v3
        if: inputs.image_tag == ''

      - uses: docker/login-action@v3
        if: inputs.image_tag == ''
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push site image
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_PUBLIC_URL }}
            NEXT_PUBLIC_CONSOLE_URL=${{ vars.CONSOLE_PUBLIC_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}
            NEXT_PUBLIC_CONTACT_TELEGRAM=${{ vars.CONTACT_TELEGRAM }}
            NEXT_PUBLIC_CONTACT_WECHAT=${{ vars.CONTACT_WECHAT }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/site:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/site:latest
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/compose/compose.site.prod.yaml
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 2
          overwrite: true

      - name: Roll out site
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ env.REGISTRY }}/${{ needs.images.outputs.namespace }}/site:${{ needs.images.outputs.tag }}
          SITE_PORT: ${{ vars.SITE_PORT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DEPLOY_PATH,IMAGE,SITE_PORT,GHCR_USER,GHCR_PULL_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            export SITE_IMAGE="$IMAGE"
            export SITE_PORT="${SITE_PORT:-3000}"

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-$USER}" --password-stdin
            fi

            docker compose -f compose.site.prod.yaml config --quiet
            docker compose -f compose.site.prod.yaml pull site
            docker compose -f compose.site.prod.yaml up -d
            docker compose -f compose.site.prod.yaml ps
            docker image prune -f