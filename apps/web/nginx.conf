# 动态处理 WebSocket Connection 头部，无 upgrade 请求时优雅关闭保持连接
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 优先保留外部网关传入的 HTTPS 协议头
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 接口及前端控制台 WebSocket (/api/control.ashx)
    location /api/ {
        proxy_pass https://meshcentral:8443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;

        proxy_ssl_verify off;
        proxy_ssl_server_name off;

        # WebSocket 保持长连接超时
        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # 客户端 Agent 连接
    location /agent.ashx {
        proxy_pass https://meshcentral:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;

        proxy_ssl_verify off;
        proxy_ssl_server_name off;

        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # Agent 下载与更新安装包
    location /meshagents {
        proxy_pass https://meshcentral:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_http_version 1.1;

        proxy_ssl_verify off;
        proxy_ssl_server_name off;
    }

    # 远程桌面/中继通道
    location /meshrelay.ashx {
        proxy_pass https://meshcentral:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;

        proxy_ssl_verify off;
        proxy_ssl_server_name off;

        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # 设置相关路径
    location /meshsettings {
        proxy_pass https://meshcentral:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_http_version 1.1;

        proxy_ssl_verify off;
        proxy_ssl_server_name off;
    }
}