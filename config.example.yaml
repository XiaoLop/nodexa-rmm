# 全局配置文件版本。生成器应按该版本选择对应的 Schema 和迁移规则。
version: 1

# 项目通用元数据，供日志、配置生成器和各服务识别当前部署。
project:
  # 项目名称，可用于 Compose 项目名、日志标签和监控指标前缀。
  name: mesh-console
  # 运行环境，建议使用 development、test、staging 或 production。
  environment: production
  # IANA 时区名称，影响日志时间、备份和其他计划任务。
  timezone: Asia/Shanghai
  # 项目默认日志级别，各服务可映射为自身支持的日志级别。
  logLevel: info

# 用户和设备从公网访问时使用的地址，不能填写 Docker 内部服务地址。
public:
  # Web 控制台公开 Origin，用于同源地址、Cookie 和 WebSocket Origin 校验。
  consoleOrigin: https://console.example.com
  # MeshCentral 公开 Origin，MeshAgent 下载脚本和 Agent 连接地址会依赖它。
  meshcentralOrigin: https://mesh.example.com

# Web 控制台的公开运行时配置，只能包含可发送到浏览器的非敏感信息。
web:
  # 浏览器访问 Gateway 时使用的统一 API 路径前缀。
  apiPrefix: /api

  # 批量上传带宽和分块策略，用于动态计算每个上传任务的数据块大小。
  batchUpload:
    # 所有并发上传任务共享的目标上行带宽，单位为 Mbps。
    bandwidthMbps: 200
    # 每个数据块期望占用的传输时间窗口，单位为毫秒。
    chunkIntervalMs: 150
    # 自动计算的数据块最小值，单位为 KiB。
    minChunkKiB: 256
    # 自动计算的数据块最大值，单位为 KiB，必须不小于 minChunkKiB。
    maxChunkKiB: 5120

# Expo App 的构建期公开配置；已安装的 App 不会直接读取服务器上的 YAML。
app:
  # App 连接控制 WebSocket 的公网地址，通常指向 Nginx 暴露的 Gateway 路由。
  gatewayUrl: wss://console.example.com/api/control.ashx

# NestJS Gateway 的监听、MeshCentral 上游和代理安全策略。
gateway:
  # Gateway 容器内 HTTP 监听配置。
  listen:
    # 监听所有容器网络接口。
    host: 0.0.0.0
    # Gateway 容器内端口，不是公网 HTTPS 端口。
    port: 3000

  # Gateway 访问 MeshCentral 时使用的内部上游配置。
  meshcentral:
    # MeshCentral 内部 Origin，Compose 中通常使用服务名和内部端口。
    origin: http://meshcentral:8443
    # MeshCentral 域路径；默认域使用 /，子域可使用 /customer-a/。
    domainPath: /
    # 上游为 HTTPS 时是否校验证书；生产 HTTPS 上游应保持 true。
    tlsRejectUnauthorized: true

  # Gateway 反向代理、超时及 WebSocket 校验设置。
  proxy:
    # Gateway 前方可信的反向代理跳数；一层 Nginx 通常为 1。
    trustProxy: 1
    # 是否允许缺少 Origin 的 WebSocket；浏览器生产环境应为 false。
    allowMissingOrigin: false
    # 普通上游 HTTP 请求总超时，单位为毫秒。
    upstreamTimeoutMs: 10000
    # 通过控制通道确认登录结果的等待超时，单位为毫秒。
    loginValidationTimeoutMs: 5000
    # WebSocket 空闲超时，单位为毫秒；0 表示 Gateway 不主动设置。
    websocketIdleTimeoutMs: 0

# MeshCentral 服务配置，由生成器转换为原生 config.json。
meshcentral:
  # MeshCentral 容器内部监听设置。
  listen:
    # MeshCentral 主服务监听所有容器网络接口。
    host: 0.0.0.0
    # MeshCentral 主服务内部端口，供 Nginx 和 Gateway 访问。
    port: 8443
    # HTTP 重定向服务端口；0 表示禁用，由 Nginx 统一处理跳转。
    redirectionPort: 0

  # MeshCentral 向浏览器、安装脚本和 Agent 公布的外部地址。
  public:
    # 对外主机名，应与 DNS、TLS 证书及 Agent 连接地址一致。
    hostname: mesh.example.com
    # 对外公布的 HTTPS 端口，通常由 Nginx 暴露为 443。
    httpsPort: 443

  # MeshCentral 运行模式及反向代理拓扑。
  runtime:
    # 是否只运行 WAN 模式；公网或跨网络管理通常启用。
    wanOnly: true
    # 是否由前置代理终止 TLS，启用后内部可使用可信 HTTP 网络。
    tlsOffload: true
    # 仅信任实际反向代理，避免客户端伪造转发头。
    trustedProxy:
      # Compose 中 Nginx 服务名，生成器可按部署环境解析可信来源。
      - nginx
    # 是否允许 MeshCentral 在线自升级；镜像部署应关闭并通过重建升级。
    selfUpdate: false

  # MeshCentral 持久化目录，生产环境应挂载 Docker volume 或持久卷。
  storage:
    # 配置、证书、密钥及本地数据目录，最重要，必须持久化和备份。
    data: /var/lib/meshcentral/data
    # 用户文件和临时文件目录，使用文件功能时应持久化并监控容量。
    files: /var/lib/meshcentral/files
    # 自动备份文件保存目录。
    backups: /var/lib/meshcentral/backups
    # 远程桌面、终端和文件会话录制目录。
    recordings: /var/lib/meshcentral/recordings

  # 浏览器登录会话及 Cookie 策略。
  session:
    # Web 登录会话有效时间，单位为分钟。
    durationMinutes: 60
    # Cookie SameSite 策略，可选 lax、strict 或 none。
    sameSite: lax
    # Cookie 与客户端 IP 的绑定策略；代理或移动网络通常使用 lax。
    cookieIpCheck: lax
    # Session Key 的 Secret 文件路径，密钥不得写入普通配置或日志。
    keyFile: /run/secrets/meshcentral-session-key

  # 数据库类型、连接信息及数据加密设置。
  database:
    # 数据库类型；当前部署使用 MongoDB。
    type: mongodb
    # 保存完整 MongoDB 连接字符串的 Secret 文件路径。
    urlFile: /run/secrets/meshcentral-mongodb-url
    # MongoDB 数据库名称，应与连接字符串和初始化配置一致。
    name: meshcentral
    # 数据库加密密钥 Secret 路径；丢失后可能无法解密已有数据。
    encryptionKeyFile: /run/secrets/meshcentral-db-encryption-key

  # 默认 MeshCentral 域的品牌、账号策略、容量限制及录制设置。
  domain:
    # 域 ID；空字符串表示默认域，非空值表示独立域或租户。
    id: ''
    # 默认域界面主标题。
    title: Mesh Console
    # 默认域界面副标题。
    title2: Secure device operations
    # 是否允许用户自行注册；生产环境通常关闭。
    allowNewAccounts: false

    # 默认域密码强度和双因素认证要求。
    passwordRequirements:
      # 密码最小长度。
      minimumLength: 12
      # 是否强制用户启用双因素认证。
      forceTwoFactor: false
      # 是否禁止 MeshCentral 已知的常见弱密码。
      banCommonPasswords: true

    # 默认域的资源和并发上限。
    limits:
      # 最大登记设备数。
      maxDevices: 1000
      # 最大用户账号数。
      maxUserAccounts: 100
      # 最大用户会话总数。
      maxUserSessions: 500
      # 最大 Agent 会话总数。
      maxAgentSessions: 2000

    # 远程会话录制策略。
    sessionRecording:
      # 是否启用录制；录制可能包含敏感屏幕、命令及文件信息。
      enabled: false
      # 录制文件最大保留天数。
      maxDays: 30
      # 要录制的 MeshCentral 协议编号。
      protocols:
        # 协议 1：远程终端。
        - 1
        # 协议 2：远程桌面。
        - 2
        # 协议 5：文件管理和文件传输。
        - 5

  # MeshCentral 全局安全开关及登录失败保护。
  security:
    # 是否启用 HSTS；只有公网始终可通过 HTTPS 访问时才应开启。
    strictTransportSecurity: true
    # 是否允许 iframe 嵌入；没有明确需求时应关闭。
    allowFraming: false
    # 是否启用登录令牌；不使用时关闭可减少认证入口。
    allowLoginToken: false
    # 是否忽略 Agent 文件哈希校验；生产环境必须保持 false。
    ignoreAgentHashCheck: false

    # 普通账号密码连续登录失败限制。
    invalidLogin:
      # 失败次数统计窗口，单位为分钟。
      windowMinutes: 10
      # 时间窗口内最大失败次数。
      maximumAttempts: 10
      # 超过限制后的冷却时间，单位为分钟。
      cooldownMinutes: 10

    # 双因素认证连续失败限制。
    invalidTwoFactor:
      # 二次验证失败次数统计窗口，单位为分钟。
      windowMinutes: 10
      # 时间窗口内最大二次验证失败次数。
      maximumAttempts: 10
      # 超过限制后的冷却时间，单位为分钟。
      cooldownMinutes: 10

  # MeshAgent 连接、升级及下载策略。
  agent:
    # MeshCentral 向 Agent 发送心跳的间隔，单位为秒。
    pingSeconds: 60
    # Agent 连接最大空闲时间，单位为秒。
    idleTimeoutSeconds: 150
    # 是否允许 MeshCentral 更新已连接的 Agent。
    allowUpdates: true
    # 是否限制 Agent 安装包下载；启用后需提供受控安装流程。
    lockDownload: false

  # MeshCentral 自动备份策略。
  backup:
    # 是否启用自动备份。
    enabled: true
    # 自动备份间隔，单位为小时。
    intervalHours: 24
    # 本地备份保留天数。
    keepDays: 10
    # 备份压缩包密码的 Secret 文件路径。
    zipPasswordFile: /run/secrets/meshcentral-backup-password

  # MeshCentral 原生配置透传区，用于项目 Schema 尚未抽象的高级设置。
  # 生成器先合并此处，再用上面的项目级配置覆盖受保护的部署关键字段。
  native:
    # 原样合并到 MeshCentral config.json 的 settings 区块。
    settings:
      # 是否压缩普通 HTTP 响应。
      compression: true
      # 是否启用浏览器 WebSocket 压缩；远程桌面场景建议关闭后压测。
      wsCompression: false
      # 是否启用 Agent WebSocket 压缩。
      agentWsCompression: false
      # 是否允许高质量远程桌面，可能增加带宽和 CPU 使用。
      allowHighQualityDesktop: true
      # 是否启用远程桌面多路复用。
      desktopMultiplex: true

    # 原样合并到 MeshCentral config.json 的 domains 区块。
    domains:
      # 空字符串表示默认域，将与 meshcentral.domain 合并。
      '':
        # 远程操作时向被控端用户展示通知的策略。
        userConsentFlags:
          # 开始远程桌面会话时显示通知。
          desktopnotify: true
          # 开始远程终端会话时显示通知。
          terminalnotify: true
          # 开始文件管理会话时显示通知。
          filenotify: true

# 公网 Nginx 反向代理的监听、TLS、路由、超时和日志脱敏配置。
proxy:
  # Nginx 暴露到宿主机或负载均衡器的端口。
  listen:
    # 公网 HTTP 端口，通常用于 HTTPS 跳转或 ACME 校验。
    httpPort: 80
    # 公网 HTTPS 端口。
    httpsPort: 443

  # Nginx 公网 TLS 证书和私钥。
  tls:
    # TLS 证书链 Secret 文件路径。
    certificateFile: /run/secrets/tls-certificate
    # TLS 私钥 Secret 文件路径，必须限制读取权限。
    privateKeyFile: /run/secrets/tls-private-key

  # 公网请求转发目标；允许值应由项目配置 Schema 限定。
  routes:
    # POST /api/login 交给 Gateway 校验输入并重写 Cookie。
    login: gateway
    # /api/control.ashx 控制 WebSocket 由 Nginx 直接转发到 MeshCentral。
    control: meshcentral
    # /api/meshrelay.ashx 高带宽 Relay WebSocket 的目标。
    relay: meshcentral
    # /api/meshagents 安装包和安装脚本下载目标。
    meshagents: meshcentral
    # /agent.ashx 等 MeshAgent 接入流量目标。
    agent: meshcentral

  # 不同流量类型的 Nginx 转发超时。
  timeouts:
    # 普通 HTTP API 请求超时，单位为秒。
    httpSeconds: 30
    # 控制和 Relay WebSocket 空闲读取超时，单位为秒。
    websocketSeconds: 3600
    # MeshAgent 长连接空闲读取超时，单位为秒。
    agentSeconds: 3600

  # Nginx 访问日志和敏感查询参数保护。
  accessLog:
    # 是否启用代理访问日志。
    enabled: true
    # 以下路径可能携带认证参数，日志必须隐藏完整查询字符串。
    redactQueryFor:
      # Relay URL 可能含 auth 和 rauth。
      - /api/meshrelay.ashx
      # Agent URL 可能含节点认证或注册信息。
      - /agent.ashx

# Docker Compose 健康检查的默认时间参数。
health:
  # 两次健康检查之间的间隔，单位为秒。
  intervalSeconds: 10
  # 单次健康检查最大执行时间，单位为秒。
  timeoutSeconds: 5
  # 标记服务 unhealthy 前允许的连续失败次数。
  retries: 10
  # 容器启动宽限期，单位为秒；期间失败不计入正式失败次数。
  startPeriodSeconds: 20
