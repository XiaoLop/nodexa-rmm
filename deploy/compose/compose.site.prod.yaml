name: nodexa-site

services:
  site:
    image: ${SITE_IMAGE:?Set SITE_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/zh-CN').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s