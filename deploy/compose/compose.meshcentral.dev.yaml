name: meshcentral-development

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: meshcentral
      MONGO_INITDB_ROOT_PASSWORD: development-password
    volumes:
      - ../../apps/meshcentral/runtime/mongodb:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--username',
          'meshcentral',
          '--password',
          'development-password',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  meshcentral:
    build:
      context: ../..
      dockerfile: apps/meshcentral/Dockerfile
      args:
        MESHCENTRAL_VERSION: 1.1.54
    image: nodexa-rmm:development
    restart: unless-stopped
    environment:
      MESHCENTRAL_SYNC_BUILTIN_PLUGINS: 'true'
      NODEXA_GEOIP_MMDB_PATH: /data/GeoLite2-City.mmdb
    command:
      - --config-yaml
      - /run/config/config.yaml
      - --datapath
      - /var/lib/meshcentral/data
    ports:
      - '8443:8443'
    volumes:
      - type: bind
        source: ${MESHCENTRAL_CONFIG_FILE:-../config/config.meshcental.dev.yaml}
        target: /run/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - ../assets:/data:ro
      - ../../apps/meshcentral/runtime/data:/var/lib/meshcentral/data
      - ../../apps/meshcentral/runtime/files:/var/lib/meshcentral/files
      - ../../apps/meshcentral/runtime/backups:/var/lib/meshcentral/backups
      - ../../apps/meshcentral/runtime/recordings:/var/lib/meshcentral/recordings
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('https').get('https://localhost:8443/', { rejectUnauthorized: false, timeout: 5000 }, response => process.exit(response.statusCode === 200 ? 0 : 1)).on('timeout', function () { this.destroy(); }).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
