# 本文件完整对应 apps/meshcentral/src/config.default.json 的字段和值，仅增加中文说明。
# 它是本项目默认配置的完整示例，不是 MeshCentral 所有可用配置项的全集。
# 配置结构基于 MeshCentral 原生 config.json；本项目启动器负责 YAML -> JSON 转换。
# 上游 1.1.54 配置参考：
# https://github.com/Ylianst/MeshCentral/blob/1.1.54/meshcentral-config-schema.json
# 最终支持范围以实际安装版本及插件实现为准；master Schema 可能随上游升级变化。
#
# 生成规则：默认 JSON + 当前传入的单个 YAML，YAML 优先，对象递归合并，数组整体替换。
# 未填写的字段继承默认值；false、0、空字符串和 null 都是显式覆盖值，不表示删除字段。
# 示例不是另一层自动加载的配置；实际部署可仅填写需要覆盖的字段。
# 启动器不会自动展开 YAML 中的环境变量，也不会仅凭 $schema 执行完整 Schema 校验。
#
# 注意：以下保留开发默认值，并非可直接上线的生产配置。
# 无反向代理、直接提供 HTTPS 时，应启用 cert，设置 tlsOffload: false、trustedProxy: null，
# 并按 Compose 设置 port（容器内端口）和 aliasPort（公网端口）。替换开发数据库密码。

# 原生配置 Schema 地址，供支持该功能的编辑器/校验工具参考；不决定运行版本。
$schema: https://raw.githubusercontent.com/Ylianst/MeshCentral/master/meshcentral-config-schema.json

# 全局服务设置，对所有 MeshCentral 域生效。
settings:
  # 下划线前缀表示未启用。改为 cert 后指定服务器主 DNS 名称，不是证书文件路径。
  _cert: mesh.example.com
  # 主服务在容器内监听的 TCP 端口；启用 TLS 卸载时该端口提供明文 HTTP。
  port: 443
  # 客户端从外部访问的端口，用于生成对外地址；不会自动创建 Docker 端口映射。
  aliasPort: 8443
  # HTTP 跳转服务端口；0 表示关闭，不提供 HTTP -> HTTPS 跳转。
  redirPort: 0
  # 服务数据目录，保存证书、身份信息、插件等；必须持久化并备份。
  dataPath: /var/lib/meshcentral/data
  # 服务端用户文件存储目录，不是远程设备上的文件目录；应持久化。
  filesPath: /var/lib/meshcentral/files
  # 仅使用 WAN 模式，Agent 通过已知服务器地址连接，不依赖 LAN 多播发现。
  WANonly: true
  # 由前置代理终止 TLS；true 时 MeshCentral 主服务本身不提供 HTTPS。
  tlsOffload: true
  # 信任这些代理来源的转发头；127.0.0.1 是容器自身，不代表其他 Nginx 容器。
  trustedProxy: 127.0.0.1
  # MongoDB 连接串：mongodb 为 Compose 服务名，authSource 为账号所在认证库。
  # 此处为公开的开发密码；生产必须替换，用户名/密码特殊字符须 URL 编码。
  # 连接串不会创建数据库用户，也不会修改已有用户密码。
  mongoDb: mongodb://meshcentral:development-password@mongodb:27017/meshcentral?authSource=admin
  # MeshCentral 使用的数据库名称，需与连接串及账号权限一致。
  mongoDbName: meshcentral
  # 禁止服务在线自升级；容器部署通过重建/更换镜像升级。
  selfUpdate: false
  # 启用普通 Web 请求的 GZIP 响应压缩。
  compression: true
  # 服务端 WebSocket per-message deflate 压缩；关闭以减少压缩 CPU 开销。
  wsCompression: false
  # Agent 侧 WebSocket 压缩；要生效通常还需 wsCompression 为 true。
  agentWsCompression: false

  # 自动备份策略。MongoDB 备份需要可用的 mongodump 等运行依赖，不能仅凭配置认定成功。
  autoBackup:
    # 自动备份间隔，单位为小时。
    backupIntervalHours: 24
    # 自动备份保留天数；不是保留文件数量。
    keepLastDaysBackup: 7
    # 容器内备份输出目录，需持久化，并另行安排异机备份与恢复验证。
    backupPath: /var/lib/meshcentral/backups

  # 插件系统设置；插件代码必须实际存在，写名称不会自动安装插件。
  plugins:
    # 启用插件系统。
    enabled: true
    # 项目使用的插件列表；覆盖时需写完整数组，否则未列出的默认项不会保留。
    list:
      # 本项目的 JSON 认证接口插件。
      - jsonauth
      # 本项目的 utils 插件，具体功能以插件实现为准。
      - utils
      # 脚本库与批量执行插件。
      - rmm

# 域级配置；这里的域是 MeshCentral 的逻辑租户，不等同于 DNS 域名。
domains:
  # 空字符串表示默认域，必须保留引号；新增非空键可定义其他逻辑域。
  '':
    # 原生管理页面主标题，不会自动修改独立 Web 前端标题。
    title: Mesh Console Dev
    # 原生管理页面副标题。
    title2: Local development
    # 是否允许从登录页注册新账号；false 不会删除已有账号，首次管理员需另行引导。
    newAccounts: false
    # 是否发送精简后的网页内容，与 HTTP GZIP 压缩是不同设置。
    minify: false

    # 服务端会话录制设置，与浏览器本地录制功能不同。
    sessionRecording:
      # 录制文件输出目录，应持久化并控制容量与访问权限。
      filepath: /var/lib/meshcentral/recordings
      # 录制协议列表：1 终端，2 桌面，5 文件，6 管理员 PowerShell，
      # 8 用户 Shell，9 用户 PowerShell，100 AMT WSMAN，101 AMT 重定向，200 Messenger。
      # 空数组表示不选择录制协议；录制内容可能包含敏感信息。
      protocols: []

    # Windows Agent 可执行文件资源元数据，供文件属性展示，在签名前定制。
    # 不会改变实际 Agent 程序版本，也不会自动给可执行文件添加可信代码签名。
    agentFileInfo:
      # dataPath 中的 .ico 图标文件名，需自行提供对应文件。
      icon: favicon.ico
      # Windows 文件属性中的文件说明。
      fileDescription: Nodexa RMM Remote Support Client
      # 文件版本，使用四段数字字符串。
      fileVersion: 1.0.0.0
      # 可执行文件内部名称。
      internalName: NodexaRMM
      # 文件属性中的版权声明文本。
      legalCopyright: Copyright Nodexa
      # 文件属性中的原始文件名，不等同于实际下载文件名。
      originalFilename: nodexa-rmm-agent.exe
      # 文件属性中的产品名称。
      productName: Nodexa RMM Agent
      # 产品版本展示文本；带字母前缀便于 Windows 属性正常显示。
      productVersion: v1.0.0.0

    # Agent 安装界面及服务品牌设置；支持情况取决于 Agent 平台和版本。
    agentCustomization:
      # 向用户展示的 Agent 名称。
      displayName: Nodexa RMM Agent
      # Agent 后台服务的描述文本。
      description: Nodexa RMM device management and remote support service
      # 用于定制 Agent 安装目录名称，不仅是公司名称展示。
      companyName: Nodexa
      # 后台服务标识，建议全小写且不包含空格；更改前评估对已安装 Agent 的影响。
      serviceName: nodexarmmagent
      # Agent 安装对话框中的说明文字。
      installText: Install the Nodexa RMM remote management service
      # dataPath 中的 PNG 图片文件名，需自行提供；建议正方形，64x64 至 200x200。
      image: logo.png
      # Agent 下载文件的基础名称，扩展名及具体命名由平台和下载流程决定。
      fileName: nodexa-rmm-agent
      # 安装界面前景文字颜色；# 开头的 YAML 字符串必须加引号。
      foregroundColor: '#FFFFFF'
      # 安装界面背景颜色。
      backgroundColor: '#2563EB'
