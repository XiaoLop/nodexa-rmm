version: 1

project:
  name: mesh-console
  environment: development
  timezone: Asia/Shanghai
  logLevel: debug

public:
  consoleOrigin: http://localhost:5173
  meshcentralOrigin: https://localhost:8443

web:
  apiPrefix: /api
  batchUpload:
    bandwidthMbps: 200
    chunkIntervalMs: 150
    minChunkKiB: 256
    maxChunkKiB: 5120

app:
  # Android 模拟器使用 10.0.2.2；真机应改为开发机局域网地址。
  gatewayUrl: ws://10.0.2.2:3000/api/control.ashx

gateway:
  listen:
    host: 0.0.0.0
    port: 3000
  meshcentral:
    origin: https://localhost:8443
    domainPath: /
    tlsRejectUnauthorized: false
  proxy:
    trustProxy: 0
    allowMissingOrigin: true
    upstreamTimeoutMs: 10000
    loginValidationTimeoutMs: 5000
    websocketIdleTimeoutMs: 0

meshcentral:
  listen:
    host: 0.0.0.0
    port: 8443
    redirectionPort: 0
  public:
    hostname: localhost
    httpsPort: 8443
  runtime:
    wanOnly: false
    tlsOffload: false
    trustedProxy: []
    selfUpdate: false
  storage:
    data: ./meshcentral-data
    files: ./meshcentral-files
    backups: ./meshcentral-backups
    recordings: ./meshcentral-recordings
  session:
    durationMinutes: 60
    sameSite: lax
    cookieIpCheck: lax
    keyFile: ./deploy/secrets/meshcentral-session-key
  database:
    type: mongodb
    urlFile: ./deploy/secrets/meshcentral-mongodb-url
    name: meshcentral
    encryptionKeyFile: ./deploy/secrets/meshcentral-db-encryption-key
  domain:
    id: ''
    title: Mesh Console Dev
    title2: Local development
    allowNewAccounts: true
    passwordRequirements:
      minimumLength: 8
      forceTwoFactor: false
      banCommonPasswords: false
    limits:
      maxDevices: 100
      maxUserAccounts: 20
      maxUserSessions: 50
      maxAgentSessions: 200
    sessionRecording:
      enabled: false
      maxDays: 7
      protocols: [1, 2, 5]
  security:
    strictTransportSecurity: false
    allowFraming: false
    allowLoginToken: false
    ignoreAgentHashCheck: false
    invalidLogin:
      windowMinutes: 10
      maximumAttempts: 20
      cooldownMinutes: 1
    invalidTwoFactor:
      windowMinutes: 10
      maximumAttempts: 20
      cooldownMinutes: 1
  agent:
    pingSeconds: 60
    idleTimeoutSeconds: 150
    allowUpdates: true
    lockDownload: false
  backup:
    enabled: false
    intervalHours: 24
    keepDays: 3
    zipPasswordFile: ./deploy/secrets/meshcentral-backup-password
  native:
    settings:
      compression: true
      wsCompression: false
      agentWsCompression: false
      allowHighQualityDesktop: true
      desktopMultiplex: true
    domains:
      '': {}

proxy:
  listen:
    httpPort: 8080
    httpsPort: 8443
  tls:
    certificateFile: ./deploy/secrets/tls-certificate.pem
    privateKeyFile: ./deploy/secrets/tls-private-key.pem
  routes:
    login: gateway
    control: meshcentral
    relay: meshcentral
    meshagents: meshcentral
    agent: meshcentral
  timeouts:
    httpSeconds: 30
    websocketSeconds: 3600
    agentSeconds: 3600
  accessLog:
    enabled: true
    redactQueryFor:
      - /api/meshrelay.ashx
      - /agent.ashx

health:
  intervalSeconds: 10
  timeoutSeconds: 5
  retries: 10
  startPeriodSeconds: 10
