packages:
  - apps/*
  - packages/*
  - test

# MeshCentral checks these optional dependencies relative to its own package directory.
# Declare them on the server package so its package.json fallback also works with pnpm.
packageExtensions:
  meshcentral@1.3.1:
    dependencies:
      image-size: 2.0.2
      mongodb: 4.17.2
      '@mongodb-js/saslprep': 1.3.1
# Packages that must not run install scripts. Keep every workspace package aligned here:
# a nested pnpm-workspace.yaml silently creates a second configuration root.
allowBuilds:
  '@scarf/scarf': true
  esbuild: true
  sharp: false
  unrs-resolver: true

# Single source of truth for dependency ranges shared by every workspace package.
# Use `"<dep>": "catalog:"` in package.json. `apps/site` pins the Next.js platform on its
# own named catalog because it tracks a different React/TypeScript/ESLint line.
catalog:
  '@eslint/js': ^10.0.1
  '@modelcontextprotocol/sdk': ^1.32.1
  '@types/node': ^26.5.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/ws': ^8.18.1
  eslint: ^10.0.0
  globals: ^17.11.0
  prettier: ^3.9.0
  react: 19.2.3
  react-dom: 19.2.3
  tsx: ^4.23.13
  turbo: ^2.10.10
  typescript: ^6.0.3
  typescript-eslint: ^8.67.0
  vitest: ^4.1.12
  ws: ^8.21.3
  zod: ^4.6.7

catalogs:
  next:
    '@types/node': ^20
    '@types/react': ^19
    '@types/react-dom': ^19
    eslint: ^9
    react: 19.2.8
    react-dom: 19.2.8
    typescript: ^5

disallowWorkspaceCycles: true

overrides:
  'express-handlebars@7.1.3>handlebars': 4.7.10
  'react-devtools-core@6.1.5>shell-quote': 1.11.0
  '@react-native/metro-config': 0.86.2
  react-native-worklets: 0.10.1
  'glob@10.4.5': 10.5.0
  'path-to-regexp@0.1.12': 0.1.13
  'qs@>=6.7.0 <6.16.1': 6.16.1
  '@xmldom/xmldom@0.8.14': 0.8.15
  '@xmldom/xmldom@0.9.11': 0.9.12
  'js-yaml@4.3.1': 4.3.2
  'undici@8.10.0': 8.12.2
  'brace-expansion@5.0.9': 5.0.12
  'node-forge@1.4.0': 1.4.3
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'compression@<1.8.2': 1.8.2
  'ip-address@<=10.7.3': 10.7.4
  'body-parser@2.3.0': 2.4.0
  'fast-uri@3.1.8': 3.1.9
  '@hono/node-server@2.1.5': 2.1.6
  'hono@4.13.13': 4.13.16
saveWorkspaceProtocol: rolling

patchedDependencies:
  meshcentral@1.3.1: apps/meshcentral/patches/meshcentral@1.3.1.patch
